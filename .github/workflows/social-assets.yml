name: social-assets

on:
  push:
    paths:
      - "assets/social/*/src/**"
      - "tools/generate_social_assets.py"
      - "city_redbubble_links.xlsx"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pillow
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Generate assets
        run: |
          for d in assets/social/ma-*/src; do
            [ -d "$d" ] || continue
            city_dir="$(dirname "$d")"
            echo ""
            echo "=== Genero $city_dir ==="
            python tools/generate_social_assets.py "$city_dir" || echo "::warning::fallita $city_dir, continuo"
          done

      - name: Build site
        run: |
          python tools/generate_social_assets.py --site

      - name: Commit generated assets + site
        run: |
          git config user.name "meridian-asset-bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A assets/social index.html style.css sitemap.xml
          find . -maxdepth 1 -type d -name "ma-*" -print0 | xargs -0 -r git add -A

          git diff --cached --quiet || { git commit -m "auto: assets + site [skip ci]"; git push; }
